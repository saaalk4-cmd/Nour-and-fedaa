name: nourfadaa
description: "نُور وفداء - تطبيق تعليمي إسلامي للأطفال"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3
  path: ^1.9.0
  crypto: ^3.0.3
  audioplayers: ^6.1.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/audio/
