name: buraq
description: "براق - تطبيق تعليمي إسلامي من سنتين إلى 14 سنة"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3
  path: ^1.9.0
  crypto: ^3.0.3
  intl: any
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/lessons/
    - assets/content/levelcheck/
    - assets/audio/
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#0E1630"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
