name: Build APK

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # مثبّت عمدًا: 3.50.0 اعتبر material.dart deprecated فكسر analyze.
          # الترقية تتم لاحقًا بقرار مستقل (ترحيل الـ imports إلى material_ui).
          flutter-version: "3.47.9"
          cache: true

      # مجلد android يُولَّد تلقائيًا إن لم يكن موجودًا في المستودع
      - name: Generate Android scaffold if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org com --project-name nourfadaa --platforms android "$RUNNER_TEMP/scaffold"
            cp -r "$RUNNER_TEMP/scaffold/android" ./android
            sed -i 's/android:label="[^"]*"/android:label="نُور وفداء"/' android/app/src/main/AndroidManifest.xml
          fi

      - run: flutter pub get
      - run: flutter analyze
      # مكتبة SQLite لاختبارات قاعدة البيانات الحقيقية (sqflite_common_ffi)
      - run: sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nour-fedaa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
