name: Separate song vocals

# تشغيل لمرة واحدة: يفصل غناء أغنية فداء ونور عن المزيكا (أكابيلا) ويرفعه كملف في release «song-vocals».
on:
  push:
    branches: ['ccr-*', 'feature/**']
    paths: ['tools/song/**', '.github/workflows/separate_song.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  separate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: bash tools/song/separate.sh
      - name: Publish vocals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete song-vocals --cleanup-tag --yes || true
          gh release create song-vocals song_vocals.mp3 --prerelease --title "song vocals" --notes "أكابيلا أغنية فداء ونور (Demucs htdemucs) من ${GITHUB_SHA::7}"
